<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthBot — IHMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: var(--grad-mesh), linear-gradient(180deg, var(--mist-50), var(--paper)); }
    .chat { width: 100%; max-width: 620px; height: min(82vh, 760px); display: flex; flex-direction: column;
      background: #fff; border: 1px solid var(--mist); border-radius: var(--r-xl); box-shadow: var(--shadow-lg); overflow: hidden; }
    .chat__head { display: flex; align-items: center; gap: .8rem; padding: 1.1rem 1.4rem; background: var(--grad-deep); color: #fff; }
    .chat__ava { width: 44px; height: 44px; border-radius: 13px; background: rgba(255,255,255,.15); display: grid; place-items: center; }
    .chat__ava svg { width: 24px; height: 24px; }
    .chat__head b { font-family: var(--font-head); font-size: 1.05rem; display: block; line-height: 1.2; }
    .chat__head span { font-size: .8rem; color: var(--soft); }
    .chat__head .back { margin-left: auto; color: #fff; opacity: .85; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; }
    .chat__head .back:hover { background: rgba(255,255,255,.12); }
    #messages { flex: 1; padding: 1.4rem; overflow-y: auto; display: flex; flex-direction: column; gap: .7rem; background: var(--mist-50); }
    .msg { padding: .7rem 1rem; border-radius: 16px; max-width: 78%; font-size: .95rem; line-height: 1.5; box-shadow: var(--shadow-sm); }
    .msg.user { background: var(--grad-brand); color: #fff; align-self: flex-end; border-bottom-right-radius: 5px; }
    .msg.bot { background: #fff; color: var(--text); align-self: flex-start; border: 1px solid var(--mist); border-bottom-left-radius: 5px; }
    .typing-indicator { font-style: italic; color: var(--text-muted); font-size: .85rem; align-self: flex-start; }
    .input-area { display: flex; gap: .6rem; padding: 1rem 1.2rem; border-top: 1px solid var(--mist); background: #fff; }
    #userInput { flex: 1; padding: .8rem 1.1rem; border: 1.5px solid var(--mist); border-radius: var(--r-pill); background: var(--mist-50); outline: none; font-family: var(--font-body); font-size: 1rem; }
    #userInput:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(1,138,190,.14); }
    .send { border: 0; cursor: pointer; width: 48px; height: 48px; border-radius: 50%; background: var(--grad-brand); color: #fff; display: grid; place-items: center; box-shadow: var(--shadow-brand); }
    .send:hover { filter: brightness(1.05); }
    .send svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div class="chat">
    <div class="chat__head">
      <span class="chat__ava"><i data-lucide="bot"></i></span>
      <div><b>HealthBot</b><span>AI symptom assistant · always here to help</span></div>
      <a class="back" href="../dashboard.php" title="Back"><i data-lucide="x"></i></a>
    </div>
    <div id="messages">
      <div class="msg bot">Hi! 👋 I'm HealthBot. Describe your symptoms and I'll suggest what to do next. (This is not a substitute for professional medical advice.)</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type your symptoms…" onkeydown="if(event.key==='Enter') sendMessage()" autofocus>
      <button class="send" onclick="sendMessage()" aria-label="Send"><i data-lucide="send"></i></button>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    if (window.lucide) lucide.createIcons();
    function sendMessage() {
      const input = document.getElementById('userInput');
      const message = input.value.trim();
      if (!message) return;
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML += `<div class="msg user">${message}</div>`;
      input.value = '';
      messagesDiv.innerHTML += `<div class="typing-indicator" id="typing">HealthBot is typing…</div>`;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      fetch('bot.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'message=' + encodeURIComponent(message)
      })
      .then(r => r.text())
      .then(reply => {
        const t = document.getElementById('typing'); if (t) t.remove();
        messagesDiv.innerHTML += `<div class="msg bot">${reply}</div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }
  </script>
</body>
</html>
